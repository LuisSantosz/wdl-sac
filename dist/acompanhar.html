<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Acompanhar solicitação | WDL SAC</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ios.css">
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="acompanhar.mjs"></script>
</head>
<body>
<main class="shell customer-portal">
  <header><img src="wdl-sac.svg" width="150" alt="WDL SAC"><h1>Acompanhar solicitação</h1></header>
  <p id="customer-feedback" role="status">Carregando solicitação…</p>
  <section id="customer-case" class="board" hidden>
    <p>Protocolo <strong id="customer-protocol"></strong></p>
    <p>Status <strong id="customer-status"></strong></p>
    <div class="portal-actions"><h2>Conversa com o SAC</h2><button id="customer-refresh" class="secondary" type="button">Atualizar</button></div>
    <ol class="portal-messages" id="customer-messages"></ol>
    <form id="customer-form">
      <label>Seu comentário<textarea name="message" rows="3" maxlength="2000" required></textarea></label>
      <button class="primary" type="submit">Enviar comentário</button>
    </form>
  </section>
</main>
</body>
</html>
